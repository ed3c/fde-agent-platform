name: Agentic work packet
description: Contract-first implementation unit governed by canonical skills-shared procedures
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: input
    id: base
    attributes:
      label: Exact repository base SHA
    validations:
      required: true
  - type: textarea
    id: shared_procedures
    attributes:
      label: Shared procedure bindings
      description: List ed3c/skills-shared, the immutable subject SHA, and only the applicable canonical paths. Do not paste Skill bodies.
      placeholder: |
        repository: ed3c/skills-shared
        subject_sha: <40-hex>
        applicable_paths:
          - skills/<name>/SKILL.md
    validations:
      required: true
  - type: textarea
    id: procedure_delta
    attributes:
      label: Procedure delta and evidence ceiling
      description: Name only the obligations required for this issue, what prior evidence already satisfies, and the highest evidence this runtime can honestly produce.
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Path lease, read-only paths, and forbidden paths
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Hard invariants and interface locks
    validations:
      required: true
  - type: textarea
    id: evals
    attributes:
      label: Verification, immutable assertions, and negative controls
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Cleanup, rollback subject, and Human-owned operations
    validations:
      required: true
